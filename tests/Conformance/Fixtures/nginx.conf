server {
    listen 80;
    server_name localhost;
    root /app;

    # One entry, both protocol eras: the fixture is built through
    # Builder::build(), which carries a dispatcher for each, and the transport
    # routes every request to the one it belongs to. Both conformance suites
    # run against this same location.
    location / {
        try_files $uri /tests/Conformance/server.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
