server {
    listen 80;
    server_name localhost;
    root /app/tests/E2E;

    # Both the MCP endpoint and the protected resource metadata are served by the
    # same script, the way a real deployment mounts the SDK's middleware stack.
    location / {
        try_files $uri /server.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
