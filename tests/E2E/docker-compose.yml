# The environment the client authorization end-to-end test runs against: a real
# authorization server, and a real MCP server built with this SDK sitting behind it.
#
# Ports and the project name are deliberately different from
# examples/server/oauth-keycloak, so this can run while that example is up.
name: mcp-client-auth-e2e

services:
  # Keycloak imports the realm the OAuth example already ships: one public client
  # with loopback redirect URIs, one demo user, and a client scope whose audience
  # mapper stamps the MCP server into the token.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../examples/server/oauth-keycloak/keycloak/mcp-realm.json:/opt/keycloak/data/import/mcp-realm.json:ro
    command:
      - start-dev
      - --import-realm
      - --http-port=8181
    ports:
      - "${E2E_KEYCLOAK_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8181; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - e2e

  php-fpm:
    image: php:8.4-fpm-alpine
    volumes:
      - ../..:/app:ro
      - ./sessions:/app/tests/E2E/sessions
    working_dir: /app
    environment:
      # Keycloak derives its issuer from the Host header, so the same realm has two
      # names: the one the client sees from the host, and the one this container
      # reaches over the compose network. Tokens carry the former and are verified
      # against keys fetched over the latter.
      MCP_E2E_ISSUER_EXTERNAL: http://localhost:${E2E_KEYCLOAK_PORT:-8181}/realms/mcp
      MCP_E2E_ISSUER_INTERNAL: http://keycloak:8181/realms/mcp
      MCP_E2E_RESOURCE: http://localhost:${E2E_MCP_PORT:-8001}/mcp
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - e2e

  nginx:
    image: nginx:1.26-alpine
    ports:
      - "${E2E_MCP_PORT:-8001}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../..:/app:ro
    depends_on:
      - php-fpm
    networks:
      - e2e

networks:
  e2e:
